<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>AutoJobs</title>
  <link rel="stylesheet" href="ui.css" />
  <style>
    body { width: 340px; padding: 16px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
    h1 { font-size: 18px; }
    h2 { font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <span class="logo">
      <span class="logo-mark"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></svg></span>
      <span>Auto<em>Jobs</em></span>
    </span>
    <button id="reload" class="btn btn-quiet btn-sm" title="Muat ulang ekstensi dan lanjutkan antrean, mis. setelah jendela AutoJobs tertutup. Lamaran yang sedang diproses diulang otomatis.">
      <svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      Muat ulang
    </button>
  </header>

  <section id="unpaired" class="stack" hidden>
    <div>
      <h1>Hubungkan ekstensi</h1>
      <p class="muted" style="margin-top:6px">Di AutoJobs, buka <b>Koneksi Portal</b> lalu klik <b>Buat kode pairing</b>. Masukkan kodenya di sini.</p>
    </div>
    <div>
      <label class="label" for="appUrl">Alamat AutoJobs</label>
      <input id="appUrl" class="input" type="url" value="http://localhost:3000" />
      <label class="label" for="code">Kode pairing</label>
      <input id="code" class="input code" type="text" placeholder="ABCD-EFGH" autocomplete="off" />
    </div>
    <button id="pair" class="btn btn-primary btn-block">Pasangkan</button>
  </section>

  <section id="paired" class="stack" hidden>
    <div class="card">
      <p class="muted small">Terhubung sebagai</p>
      <p><b id="email"></b></p>
      <p class="muted small mono" id="server"></p>
    </div>
    <div>
      <h2>Login portal di Chrome ini</h2>
      <ul id="portals" class="list" style="margin-top:8px"></ul>
    </div>
    <div id="held" class="notice" hidden>
      <svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <div>
        <p>Antrean ditahan sejak Chrome dibuka, supaya jendela AutoJobs tidak terbuka tiba-tiba.</p>
        <button id="resume" class="btn btn-primary" style="margin-top:10px">Lanjutkan antrean</button>
      </div>
    </div>
    <p class="muted" id="activity"></p>
    <div class="row">
      <button id="check" class="btn">Periksa login portal</button>
      <button id="unpair" class="btn btn-danger">Putuskan</button>
    </div>
    <label class="toggle"><input type="checkbox" id="shots" /><span>Simpan tangkapan layar sebagai bukti (perlu izin akses semua situs)</span></label>
  </section>

  <p id="msg" class="msg" style="margin-top:12px"></p>
  <script src="popup.js"></script>
</body>
</html>
